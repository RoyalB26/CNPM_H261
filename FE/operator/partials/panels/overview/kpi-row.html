<div class="kpi-row">
  <div class="kpi-card">
    <div class="kpi-label">Tổng số Hub</div>
    <div class="kpi-value" id="kpiTotalHubs">50</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label">Xe đang rảnh / Tổng xe</div>
    <div class="kpi-value"><span id="kpiAvailableBikes">120</span> <span style="font-size: 18px; color: var(--text-muted); font-weight: 500;">/ 500</span></div>

  <div class="kpi-card">
    <div class="kpi-label">Cổng sạc khả dụng</div>

  <div class="kpi-card" style="border-left: 4px solid var(--accent-red);">
    <div class="kpi-label">Cảnh báo hệ thống</div>
    <div class="kpi-value" style="color: var(--accent-red);" id="kpiAlerts">2</div>
  </div>
  <div class="kpi-card" style="border-left: 4px solid #2563eb;">
    <div class="kpi-label">Lệnh điều phối đang chạy</div>
    <div class="kpi-value" style="color: #2563eb;" id="kpiActiveRelocations">0</div>
  </div>
