<!-- Partial: user/partials/screens/active-services/ride-active.html -->
<section id="screen-ride-active" class="screen">
  <div class="top-nav">
    <button class="nav-back" onclick="App.navigateTo('screen-map-home')"><i class="fa-solid fa-arrow-left"></i></button>
    <span class="nav-title">Chuyến đi đang diễn ra</span>
    <i class="fa-solid fa-bicycle nav-action"></i>
  </div>

  <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;" id="rideActiveSubtitle">
    —
  </div>

  <!-- Duration big card -->
  <div class="card-box">
    <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 4px;">Thời gian tính cước từ khi đặt xe</div>
    <div style="font-size: 38px; font-weight: 800; margin-bottom: 14px;" id="rideTimer">—</div>
    <div style="display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 6px;">
      <span style="color: var(--text-muted);">Pin hiện tại</span>
      <span style="font-weight: 700;" id="rideBatteryLevel">—</span>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 13.5px;">
      <span style="color: var(--text-muted);">Trạng thái</span>
      <span style="font-weight: 600; color: #10b981;" id="rideStatusBadge">Đang sử dụng</span>
    </div>
  </div>

  <!-- Log checkpoints -->
  <div class="card-box">
    <h4 style="font-size: 14px; font-weight: 700; margin-bottom: 12px;">Các mốc ghi nhận</h4>
    <div style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px;">
      <span style="color: var(--text-muted);">Đặt xe</span>
      <span style="font-weight: 500;" id="rideBookedAt">—</span>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px;">
      <span style="color: var(--text-muted);">Nhận / bắt đầu</span>
      <span style="font-weight: 500;" id="rideStartedAt">—</span>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 13px;">
      <span style="color: var(--text-muted);">Đồng hồ hiển thị</span>
      <span style="font-weight: 500;" id="rideClockUpdatedAt">—</span>
    </div>
  </div>

  <p style="font-size: 12px; color: var(--text-muted); line-height: 1.4; margin-bottom: 20px;">
    Tài nguyên và trạng thái dịch vụ được cập nhật sau mỗi thao tác hợp lệ.
  </p>

  <button class="btn-secondary" style="margin-bottom: 12px;" onclick="App.prepareReport('Phương tiện', 'XE-024')">Báo sự cố phương tiện</button>
  <button class="btn-primary" onclick="App.navigateTo('screen-return-vehicle')">Kết thúc và trả xe</button>
</section>
