<section id="screen-parking-arrival" class="screen">
  <div class="top-nav">
    <button class="nav-back" onclick="App.navigateTo('screen-personal-booking')"><i class="fa-solid fa-arrow-left"></i></button>
    <span class="nav-title">Đưa xe vào chỗ đỗ</span>
    <span class="nav-icon-badge-p">P</span>
  </div>

  <div style="font-size: 13.5px; color: var(--text-muted); margin-bottom: 14px;">EMH-1024 · Xe cá nhân</div>

  <div class="card-box" style="margin-bottom: 16px;">
    <div style="font-size: 15px; font-weight: 700; margin-bottom: 12px; color: var(--text-main);">Đặt chỗ đỗ còn hiệu lực</div>
    <div class="detail-row-line">
      <span style="color: var(--text-muted);">Phương tiện</span>
      <span style="font-weight: 600; color: var(--text-main);">59-X1 123.45</span>
    </div>
    <div class="detail-row-line">
      <span style="color: var(--text-muted);">Hub / vị trí</span>
      <span style="font-weight: 600; color: var(--text-main);">Ga Metro · P08</span>
    </div>
    <div class="detail-row-line">
      <span style="color: var(--text-muted);">Lịch sử dụng</span>
      <span style="font-weight: 600; color: var(--text-main);">10:00 – 12:00</span>
    </div>
  </div>

  <div class="form-group" style="margin-bottom: 16px;">
    <label class="form-label" style="font-weight: 700;">Mã vị trí đỗ *</label>
    <div class="input-with-button">
      <input type="text" id="parkingSlotCodeInput" value="P08" />
      <button type="button" class="btn-inline-action" onclick="App.showToast('Quét QR vị trí đỗ P08 thành công!')">Quét QR</button>
    </div>
  </div>

  <label class="checkbox-custom-row">
    <input type="checkbox" id="parkingCheckConfirm" checked />
    <span>Tôi đã đưa đúng phương tiện vào vị trí đỗ.</span>
  </label>

  <div class="note-box-simple" style="margin-top: 20px; margin-bottom: 24px;">
    Hệ thống kiểm tra đặt trước, lịch và trạng thái vị trí trước khi ghi nhận xe vào.
  </div>

  <button class="btn-primary" style="width: 100%; font-weight: 700;" onclick="App.navigateTo('screen-parking-active')">Xác nhận xe đã vào chỗ đỗ</button>
