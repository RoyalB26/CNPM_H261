<!-- Partial: user/partials/screens/auth-profile/payment-preferences.html -->
<section id="screen-payment-preferences" class="screen">
  <div class="top-nav">
    <button class="nav-back" onclick="App.navigateTo('screen-profile')"><i class="fa-solid fa-arrow-left"></i></button>
    <span class="nav-title">Phương thức thanh toán</span>
  </div>
  <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 16px;">Chọn phương thức mặc định khi thanh toán dịch vụ tự động:</p>

  <div class="card-box selectable selected" id="prefWallet" onclick="App.setPaymentPreference('Ví điện tử')">
    <div style="display: flex; align-items: center; gap: 12px;">
      <i class="fa-solid fa-wallet" style="font-size: 18px;"></i>
      <div>
        <div style="font-weight: 600; font-size: 14px;">Ví điện tử Momo/ZaloPay</div>
        <div style="font-size: 12px; color: var(--text-muted);">Đã liên kết (0123***789)</div>
      </div>
    </div>
    <div class="radio-circle checked" id="radioPrefWallet"></div>
  </div>

  <div class="card-box selectable" id="prefBank" onclick="App.setPaymentPreference('Thẻ ngân hàng')">
    <div style="display: flex; align-items: center; gap: 12px;">
      <i class="fa-solid fa-credit-card" style="font-size: 18px;"></i>
      <div>
        <div style="font-weight: 600; font-size: 14px;">Thẻ nội địa / Napas</div>
        <div style="font-size: 12px; color: var(--text-muted);">Vietcombank **** 9821</div>
      </div>
    </div>
    <div class="radio-circle" id="radioPrefBank"></div>
  </div>

  <button class="btn-primary" style="margin-top: 20px;" onclick="App.showToast('Đã lưu cấu hình thanh toán'); App.navigateTo('screen-profile');">Lưu cấu hình</button>
</section>
