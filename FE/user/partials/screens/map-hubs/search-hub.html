<!-- Partial: user/partials/screens/map-hubs/search-hub.html -->
<section id="screen-search-hub" class="screen">
  <div class="top-nav">
    <button class="nav-back" onclick="App.navigateTo('screen-map-home')"><i class="fa-solid fa-arrow-left"></i></button>
    <div class="input-box" style="flex: 1;">
      <input type="text" id="searchInput" placeholder="Tìm Hub, trường, KTX, địa điểm..." oninput="App.filterHubs(this.value)">
      <i class="fa-solid fa-magnifying-glass input-icon"></i>
    </div>
  </div>

  <!-- Search filter tags -->
  <div style="display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px;">
    <button class="segmented-tab active" id="filterTabAll" style="padding: 6px 14px; font-size: 12px; border-radius: 20px; white-space: nowrap;" onclick="App.setSearchCategory('all')">Tất cả</button>
    <button class="segmented-tab" id="filterTabHub" style="padding: 6px 14px; font-size: 12px; border-radius: 20px; white-space: nowrap;" onclick="App.setSearchCategory('hub')">Mobility Hub</button>
    <button class="segmented-tab" id="filterTabSchool" style="padding: 6px 14px; font-size: 12px; border-radius: 20px; white-space: nowrap;" onclick="App.setSearchCategory('school')">Trường & Viện</button>
    <button class="segmented-tab" id="filterTabDorm" style="padding: 6px 14px; font-size: 12px; border-radius: 20px; white-space: nowrap;" onclick="App.setSearchCategory('dorm')">KTX</button>
    <button class="segmented-tab" id="filterTabAmenity" style="padding: 6px 14px; font-size: 12px; border-radius: 20px; white-space: nowrap;" onclick="App.setSearchCategory('amenity')">Tiện ích / Điểm đến</button>
  </div>

  <div class="card-box" style="margin-bottom: 14px; padding: 12px 14px; background: #f8fafc;">
    <div style="font-size: 12px; font-weight: 800; margin-bottom: 8px; color: var(--text-main);">
      <i class="fa-solid fa-route" style="margin-right: 4px;"></i> GỢI Ý LỘ TRÌNH HUB TỐI ƯU
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px;">
      <select id="routeOriginPreset" style="padding: 8px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 12px;">
        <option value="10.8835,106.7820">Điểm đi: KTX Khu B</option>
        <option value="10.8753,106.8005">Điểm đi: Ga Metro ĐHQG</option>
        <option value="10.8778,106.8018">Điểm đi: ĐH Quốc Tế</option>
      </select>
      <select id="routeDestPreset" style="padding: 8px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 12px;">
        <option value="10.8805,106.8055">Điểm đến: ĐH Bách khoa</option>
        <option value="10.8753,106.8005">Điểm đến: Ga Metro ĐHQG</option>
        <option value="10.8835,106.7820">Điểm đến: KTX Khu B</option>
      </select>
    </div>
    <button type="button" class="btn-primary" style="padding: 8px 12px; font-size: 12.5px;" onclick="App.suggestOptimalRoute()">Tìm lộ trình Hub phù hợp</button>
    <div id="routeSuggestResult" style="display: none; margin-top: 10px; font-size: 12.5px; background: #ffffff; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px;"></div>
  </div>

  <div style="margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
    <span style="font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;" id="searchHeaderLabel">Gợi ý Hub & Địa điểm ĐHQG</span>
    <span style="font-size: 11.5px; color: var(--text-muted);" id="searchResultCount">569 địa điểm</span>
  </div>

  <div id="hubListContainer" style="display: flex; flex-direction: column; gap: 10px;">
    <!-- Dynamically populated by App.renderSearchList() -->
  </div>
</section>
