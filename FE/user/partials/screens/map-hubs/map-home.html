<!-- Partial: user/partials/screens/map-hubs/map-home.html -->
<section id="screen-map-home" class="screen" style="padding: 12px 14px 75px 14px;">
  <!-- Top Search Bar on Map -->
  <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
    <div class="input-box" onclick="App.navigateTo('screen-search-hub')" style="cursor: pointer; background: #eef2f6; border-radius: var(--radius-md); border: none; padding: 2px 4px;">
      <i class="fa-solid fa-magnifying-glass" style="margin-left: 14px; color: #475569; font-size: 15px;"></i>
      <input type="text" placeholder="Tìm kiếm Hub hoặc địa điểm" readonly style="border: none; background: transparent; cursor: pointer; padding: 12px 10px; font-weight: 500;">
    </div>
    <button onclick="App.navigateTo('screen-profile')" style="width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--border-color); background: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
      <i class="fa-regular fa-user" style="font-size: 17px; color: var(--text-main);"></i>
    </button>
  </div>

  <!-- Interactive Map Container (MapLibre with OSM fallback) -->
  <div class="sim-map-wrapper">
    <div id="maplibre-container"></div>

    <!-- Fallback SVG if offline / WebGL unavailable -->
    <svg id="fallbackSvgMap" class="map-svg" viewBox="0 0 400 480" style="display: none;">
      <!-- Road background lines -->
      <rect width="400" height="480" fill="#e2e8f0"/>
      <!-- Roads grid -->
      <path d="M 0,90 Q 200,120 400,90" stroke="#cbd5e1" stroke-width="12" fill="none"/>
      <path d="M 0,220 Q 180,240 400,210" stroke="#cbd5e1" stroke-width="18" fill="none"/>
      <path d="M 0,380 L 400,360" stroke="#cbd5e1" stroke-width="14" fill="none"/>
      <path d="M 70,0 Q 80,200 90,480" stroke="#cbd5e1" stroke-width="14" fill="none"/>
      <path d="M 200,0 L 210,480" stroke="#cbd5e1" stroke-width="16" fill="none"/>
      <path d="M 310,0 Q 330,240 320,480" stroke="#cbd5e1" stroke-width="12" fill="none"/>
      <!-- Curve highway -->
      <path d="M 40,300 C 120,300 240,250 380,140" stroke="#94a3b8" stroke-width="8" fill="none" opacity="0.6"/>

      <!-- Center label -->
      <text x="200" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#334155" font-family="sans-serif">Khu đô thị Đại học Quốc Gia</text>

      <!-- Map Markers for Hubs -->
      <!-- Hub 1: Ga Metro -->
      <g class="map-pin" onclick="App.openHubSheet('hub-01')" transform="translate(195, 155)">
        <circle cx="8" cy="8" r="16" fill="#1e293b" opacity="0.15"/>
        <path d="M8 0C3.58 0 0 3.58 0 8c0 5.25 8 16 8 16s8-10.75 8-16c0-4.42-3.58-8-8-8z" fill="#0f172a"/>
        <circle cx="8" cy="8" r="3.5" fill="#ffffff"/>
      </g>
      <!-- Hub 2: Bách Khoa -->
      <g class="map-pin" onclick="App.openHubSheet('hub-02')" transform="translate(265, 215)">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 5.25 8 16 8 16s8-10.75 8-16c0-4.42-3.58-8-8-8z" fill="#0f172a"/>
        <circle cx="8" cy="8" r="3.5" fill="#ffffff"/>
      </g>
      <!-- Hub 3: KTX B -->
      <g class="map-pin" onclick="App.openHubSheet('hub-03')" transform="translate(95, 255)">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 5.25 8 16 8 16s8-10.75 8-16c0-4.42-3.58-8-8-8z" fill="#0f172a"/>
        <circle cx="8" cy="8" r="3.5" fill="#ffffff"/>
      </g>
      <!-- Hub 4: Quốc Tế -->
      <g class="map-pin" onclick="App.openHubSheet('hub-04')" transform="translate(105, 130)">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 5.25 8 16 8 16s8-10.75 8-16c0-4.42-3.58-8-8-8z" fill="#0f172a"/>
        <circle cx="8" cy="8" r="3.5" fill="#ffffff"/>
      </g>
    </svg>

    <!-- Current active pill alert if running a trip -->
    <div id="activeRidePill" style="position: absolute; bottom: 16px; left: 16px; right: 16px; background: #ffffff; border-radius: var(--radius-md); padding: 12px 14px; box-shadow: var(--shadow-md); display: flex; align-items: center; justify-content: space-between;" onclick="App.navigateTo('screen-ride-active')">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="width: 10px; height: 10px; border-radius: 50%; background: #10b981; animation: pulse 1.5s infinite;"></div>
        <div>
          <div id="activeRidePillText" style="font-size: 13px; font-weight: 700;">Chuyến đi: XE-024 đang hoạt động</div>
          <div style="font-size: 11.5px; color: var(--text-muted);">Nhấn để xem trạng thái thời gian thực</div>
        </div>
      </div>
      <i class="fa-solid fa-chevron-right" style="color: var(--text-muted); font-size: 12px;"></i>
    </div>
  </div>

  <!-- Bottom Sheet Popup for Hub Preview (EU-06) -->
  <div id="hubBottomSheet" class="bottom-sheet-modal">
    <div class="sheet-handle"></div>
    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px;">
      <div>
        <h2 id="sheetHubName" style="font-size: 18px; font-weight: 800;">Hub Ga Metro ĐHQG</h2>
        <p id="sheetHubAddress" style="font-size: 12.5px; color: var(--text-muted);">Khu đô thị ĐHQG - HCM</p>
      </div>
      <button onclick="App.closeHubSheet()" style="background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-muted);"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div style="border-top: 1px solid var(--border-color); margin: 16px 0;"></div>

    <div style="display: flex; flex-direction: column; gap: 14px; margin-bottom: 22px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <i class="fa-solid fa-bicycle" style="font-size: 18px; width: 20px;"></i>
          <span style="font-weight: 600; font-size: 14px;">Xe đạp điện</span>
        </div>
        <span id="sheetHubBikes" style="font-size: 13px; color: var(--text-muted);">5 xe khả dụng</span>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <i class="fa-solid fa-square-parking" style="font-size: 18px; width: 20px;"></i>
          <span style="font-weight: 600; font-size: 14px;">Chỗ đỗ xe</span>
        </div>
        <span id="sheetHubParking" style="font-size: 13px; color: var(--text-muted);">8 chỗ đỗ trống</span>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <i class="fa-solid fa-bolt" style="font-size: 18px; width: 20px;"></i>
          <span style="font-weight: 600; font-size: 14px;">Cổng sạc</span>
        </div>
        <span id="sheetHubChargers" style="font-size: 13px; color: var(--text-muted);">2 cổng khả dụng</span>
      </div>
    </div>

    <button class="btn-primary" onclick="App.startBookingFromHub()">Bắt đầu đặt chỗ</button>
  </div>
</section>
