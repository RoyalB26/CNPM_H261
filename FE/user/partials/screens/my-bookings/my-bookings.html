<!-- Partial: user/partials/screens/my-bookings/my-bookings.html -->
<section id="screen-my-bookings" class="screen">
  <div class="top-nav">
    <button class="nav-back" onclick="App.navigateTo('screen-map-home')"><i class="fa-solid fa-arrow-left"></i></button>
    <span class="nav-title">Đặt trước của tôi</span>
    <i class="fa-regular fa-calendar-check nav-action"></i>
  </div>

  <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 16px;">Xem lịch và trạng thái của từng đặt trước</p>

  <!-- Segmented Tab for Booking Status -->
  <div class="segmented-tabs">
    <button class="segmented-tab active" id="tabBookingUpcoming" onclick="App.switchBookingListTab('upcoming')">Sắp tới</button>
    <button class="segmented-tab" id="tabBookingActive" onclick="App.switchBookingListTab('active')">Đang dùng</button>
    <button class="segmented-tab" id="tabBookingHistory" onclick="App.switchBookingListTab('history')">Lịch sử</button>
  </div>

  <div id="bookingCardsContainer">
    <div style="text-align: center; padding: 40px 20px; color: var(--text-muted);">
      <i class="fa-regular fa-calendar-xmark" style="font-size: 32px; margin-bottom: 10px; opacity: 0.5;"></i>
      <div style="font-weight: 600;">Bạn không có đặt chỗ nào sắp tới</div>
    </div>
  </div>

  <button class="btn-secondary" style="margin-top: 10px;" onclick="App.navigateTo('screen-map-home')">Đặt thêm dịch vụ</button>
</section>
