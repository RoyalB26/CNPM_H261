<!-- Partial: user/partials/screens/my-bookings/my-bookings.html -->
<section id="screen-my-bookings" class="screen">
  <div class="top-nav">
    <button class="nav-back" onclick="App.navigateTo('screen-map-home')"><i class="fa-solid fa-arrow-left"></i></button>
    <span class="nav-title">Đặt trước của tôi</span>
    <i class="fa-regular fa-calendar-check nav-action"></i>
  </div>

  <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 16px;">Xem lịch và trạng thái của từng đặt trước</p>

  <!-- Segmented Tab for Booking Status -->
  <div class="segmented-tabs">
    <button class="segmented-tab active" id="tabBookingUpcoming" onclick="App.switchBookingListTab('upcoming')">Sắp tới</button>
    <button class="segmented-tab" id="tabBookingActive" onclick="App.switchBookingListTab('active')">Đang dùng</button>
    <button class="segmented-tab" id="tabBookingHistory" onclick="App.switchBookingListTab('history')">Lịch sử</button>
  </div>

  <div id="bookingCardsContainer">
    <!-- Card 1: Rental -->
    <div class="card-box">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <span style="font-weight: 800; font-size: 14.5px;">EMH-1023 · Thuê xe</span>
        <span style="font-size: 11px; background: #e0f2fe; color: #0284c7; padding: 2px 8px; border-radius: 4px; font-weight: 600;">Đã xác nhận</span>
      </div>
      <div style="font-size: 13px; margin-bottom: 4px;">XE-024 · Hub Ga Metro ĐHQG</div>
      <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 14px;">Giữ đến 08:10 · ví dụ chính sách</div>
      <button class="btn-primary" onclick="App.navigateTo('screen-booking-detail')">Chi tiết và nhận xe</button>
    </div>

    <!-- Card 2: Personal Vehicle -->
    <div class="card-box">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <span style="font-weight: 800; font-size: 14.5px;">EMH-1024 · Xe cá nhân</span>
        <span style="font-size: 11px; background: #e0f2fe; color: #0284c7; padding: 2px 8px; border-radius: 4px; font-weight: 600;">Đã xác nhận</span>
      </div>
      <div style="font-size: 13px; margin-bottom: 4px;">Chỗ đỗ + sạc · Hub Ga Metro</div>
      <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 14px;">18/10/2026 · từ 10:00</div>
      <button class="btn-secondary" onclick="App.navigateTo('screen-personal-booking')">Xem dịch vụ xe cá nhân</button>
    </div>
  </div>

  <button class="btn-secondary" style="margin-top: 10px;" onclick="App.navigateTo('screen-map-home')">Đặt thêm dịch vụ</button>
</section>
