<!-- Partial: user/partials/screens/payment/payment-method.html -->
<section id="screen-payment-method" class="screen">
  <div class="top-nav">
    <button class="nav-back" onclick="App.navigateTo('screen-invoice-rental')"><i class="fa-solid fa-arrow-left"></i></button>
    <span class="nav-title">Phương thức thanh toán</span>
    <i class="fa-regular fa-credit-card nav-action"></i>
  </div>

  <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;" id="payServiceDesc">Hóa đơn dịch vụ đã chọn</p>

  <div class="card-box">
    <div style="font-size: 14px; font-weight: 700; margin-bottom: 6px;">Khoản cần thanh toán</div>
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span style="font-size: 13px; color: var(--text-muted);">Số tiền</span>
      <span style="font-size: 18px; font-weight: 800;" id="payAmountDisplay">15,000 đ</span>
    </div>
  </div>

  <div style="font-size: 13px; font-weight: 700; margin-bottom: 10px;">Chọn phương thức</div>

  <div class="card-box selectable selected" id="methodWallet" onclick="App.selectPayMethod('Ví điện tử', 'methodWallet')">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div class="radio-circle checked" id="radioMethodWallet"></div>
      <div>
        <div style="font-weight: 700; font-size: 14px;">Ví điện tử</div>
        <div style="font-size: 12px; color: var(--text-muted);">Thanh toán tích hợp</div>
      </div>
    </div>
  </div>

  <div class="card-box selectable" id="methodBank" onclick="App.selectPayMethod('Thẻ ngân hàng', 'methodBank')">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div class="radio-circle" id="radioMethodBank"></div>
      <div>
        <div style="font-weight: 700; font-size: 14px;">Thẻ ngân hàng</div>
        <div style="font-size: 12px; color: var(--text-muted);">Thanh toán tích hợp</div>
      </div>
    </div>
  </div>

  <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 24px;">
    Kiểm tra dịch vụ, số tiền và phương thức trước khi tiếp tục.
  </p>

  <button class="btn-primary" onclick="App.navigateTo('screen-payment-confirm')">Tiếp tục thanh toán</button>
</section>
