<!-- Partial: user/partials/screens/payment/invoice-rental.html -->
<section id="screen-invoice-rental" class="screen">
  <div class="top-nav">
    <button class="nav-back" onclick="App.navigateTo('screen-map-home')"><i class="fa-solid fa-arrow-left"></i></button>
    <span class="nav-title">Hóa đơn dịch vụ</span>
  </div>
  <div class="card-box">
    <h3 style="font-size: 16px; font-weight: 800; margin-bottom: 12px;" id="invoiceRentalTitle">Hóa đơn thuê xe điện</h3>
    <div style="display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 8px;">
      <span style="color: var(--text-muted);" id="invoiceRentalItemLabel">Cước thuê xe sau khi trả</span>
      <span style="font-weight: 600;" id="invoiceRentalItemCost">—</span>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 12px;">
      <span style="color: var(--text-muted);">Phụ phí trễ hạn</span>
      <span style="font-weight: 600;" id="invoiceRentalPenaltyCost">0 đ</span>
    </div>
    <div style="border-top: 1px dashed var(--border-color); padding-top: 10px; display: flex; justify-content: space-between; font-size: 16px; font-weight: 800;">
      <span>Tổng thanh toán</span>
      <span id="invoiceRentalTotalCost">—</span>
    </div>
  </div>
  <p id="invoiceRentalNotice" role="status">Trả xe thành công để xem hóa đơn của chuyến đi.</p>
  <button class="btn-secondary" id="retryRentalInvoice" style="display: none; margin-bottom: 12px;" onclick="App.loadRentalInvoice()">Thử tải lại hóa đơn</button>
  <button class="btn-primary" id="btnPayRental" disabled onclick="App.setupInvoiceAndPay('rental', 0)">Chọn thanh toán</button>
</section>
