<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart E-Mobility Hub - ĐHQG-HCM</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- MapLibre GL CSS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- Mobile/Desktop Container Wrapper -->
  <div class="app-container">
    
    <div data-include="partials/layout/status-bar.html"></div>

    <div data-include="partials/layout/toast.html"></div>

    <!-- Main Screens Viewport -->
    <div class="view-viewport" id="viewport">

      <div data-include="partials/screens/auth-profile.html"></div>
      <div data-include="partials/screens/map-hubs.html"></div>
      <div data-include="partials/screens/booking.html"></div>
      <div data-include="partials/screens/my-bookings.html"></div>
      <div data-include="partials/screens/active-services.html"></div>
      <div data-include="partials/screens/payment.html"></div>
      <div data-include="partials/screens/incidents.html"></div>
    </div><!-- End of view-viewport -->

    <div data-include="partials/layout/bottom-nav.html"></div>

  </div><!-- End of app-container -->

  <!-- MapLibre GL JS -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <!-- Shared Core Utilities -->
  <script src="../shared/js/config.js"></script>
  <script src="../shared/js/http.js"></script>
  <script src="../shared/js/utils.js"></script>
  <script src="../shared/js/include.js"></script>
  <!-- DHQG Named Places Data -->
  <script src="js/places-data.js"></script>
  <!-- State & API Layer -->
  <script src="js/state.js"></script>
  <script src="js/api.js"></script>
  <!-- Domain Feature Modules -->
  <script src="js/modules/router.js"></script>
  <script src="js/modules/auth-profile.js"></script>
  <script src="js/modules/map-hubs.js"></script>
  <script src="js/modules/booking.js"></script>
  <script src="js/modules/active-services.js"></script>
  <script src="js/modules/payment.js"></script>
  <script src="js/modules/incidents.js"></script>
  <!-- App Core Bootstrapper -->
  <script src="js/app.js"></script>
</body>
</html>
