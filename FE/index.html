<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart E-Mobility Hub - Điều Phối Phương Tiện ĐHQG-HCM</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Portal Stylesheet -->
  <link rel="stylesheet" href="portal/css/portal.css">
</head>
<body>

  <!-- Main Portal Hub Container -->
  <div class="portal-box">
    
    <div data-include="portal/partials/header.html"></div>

    <div data-include="portal/partials/role-grid.html"></div>

    <div data-include="portal/partials/footer.html"></div>

  </div>

  <!-- Shared HTML Partial Loader -->
  <script src="shared/js/include.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      if (window.HtmlInclude) {
        await window.HtmlInclude.loadAll();
      }
    });
  </script>
</body>
</html>
