<!-- Partial: staff/partials/screens/maintenance/maint-incident.html -->
<section id="screen-maint-incident" class="staff-screen">
  <div class="screen-top-bar">
    <button class="nav-back-btn" onclick="StaffApp.goToScreen('screen-maint-report')"><i class="fa-solid fa-angle-left"></i></button>
    <div class="top-bar-title-wrap">
      <div class="sub-label">BÁO CÁO TRONG QUÁ TRÌNH BẢO TRÌ</div>
      <div class="main-label">Báo cáo sự cố</div>
    </div>
    <span style="font-size: 12px; font-weight: 700; color: var(--text-muted);">MT-102</span>
  </div>

  <!-- Notice Banner -->
  <div class="dark-notice-banner" style="margin-bottom: 16px;">
    <div class="notice-icon"><i class="fa-solid fa-exclamation"></i></div>
    <div>
      <div style="font-weight: 800; font-size: 13.5px; margin-bottom: 2px;">Ghi nhận sự cố mới</div>
      <div style="font-size: 11.5px; color: #94a3b8;">Báo cáo để đội vận hành hỗ trợ kịp thời.</div>
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 800; margin-bottom: 6px;">
    <span>THÔNG TIN SỰ CỐ</span>
    <span style="color: var(--accent-red); font-size: 11px;">Bắt buộc</span>
  </div>

  <div style="margin-bottom: 12px;">
    <label class="input-label-sm">Loại sự cố</label>
    <select class="form-select-sm">
      <option>Xe hư hỏng giữa đường</option>
      <option>Trạm sạc rò rỉ điện</option>
      <option>Khóa thông minh không phản hồi</option>
    </select>
  </div>

  <div style="margin-bottom: 12px;">
    <label class="input-label-sm">Vị trí xảy ra sự cố</label>
    <div class="input-with-icon">
      <i class="fa-solid fa-location-dot"></i>
      <input type="text" class="form-input-sm" value="Đường nội bộ · Hub KTX Khu A">
    </div>
    <span style="font-size: 11px; color: var(--text-muted); margin-top: 4px; display: block;">Vị trí được ghi nhận tại thời điểm báo cáo.</span>
  </div>

  <div style="margin-bottom: 14px;">
    <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
      <label class="input-label-sm">MÔ TẢ CHI TIẾT</label>
      <span style="font-size: 11px; color: var(--text-muted);">0 / 300</span>
    </div>
    <textarea class="form-textarea-sm" rows="3" placeholder="Mô tả thiết bị, nguyên nhân và tình trạng hiện tại... Ví dụ: Xe không lên nguồn sau khi đi qua đoạn ngập."></textarea>
  </div>

  <div style="margin-bottom: 24px;">
    <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
      <label class="input-label-sm">ẢNH HIỆN TRẠNG</label>
      <span style="font-size: 11px; color: var(--text-muted);">Không bắt buộc</span>
    </div>
    <div class="dashed-upload-box" onclick="alert('Đã đính kèm ảnh hiện trạng')">
      <i class="fa-solid fa-camera" style="font-size: 18px; margin-bottom: 6px;"></i>
      <span style="font-size: 12px; font-weight: 700;">ĐÍNH KÈM ẢNH</span>
    </div>
  </div>

  <button class="btn-staff-primary" onclick="StaffApp.submitMaintIncident()">
    <span>GỬI BÁO CÁO SỰ CỐ</span>
  </button>
</section>
