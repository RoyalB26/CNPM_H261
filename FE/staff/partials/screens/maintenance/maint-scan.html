<!-- Partial: staff/partials/screens/maintenance/maint-scan.html -->
<section id="screen-maint-scan" class="staff-screen">
  <div class="screen-top-bar">
    <button class="nav-back-btn" onclick="StaffApp.goToScreen('screen-maint-detail')"><i class="fa-solid fa-angle-left"></i></button>
    <div class="top-bar-title-wrap">
      <div class="sub-label">XÁC NHẬN THIẾT BỊ</div>
      <div class="main-label">Quét mã QR</div>
    </div>
    <span style="font-size: 12px; font-weight: 700; color: var(--text-muted);">MT-102</span>
  </div>

  <div style="margin-bottom: 12px;">
    <div style="font-size: 13px; font-weight: 800;">QUÉT QR XÁC NHẬN VỊ TRÍ</div>
    <div style="font-size: 12px; color: var(--text-muted);">Đưa mã QR trên thiết bị vào giữa khung quét.</div>
  </div>

  <!-- Camera Scanner with Viewfinder -->
  <div class="camera-scanner-frame" style="margin-bottom: 14px; background: #1e293b; color: #ffffff;">
    <div class="qr-target-box" style="border: none; width: 200px; height: 130px;">
      <div class="qr-crosshair top-left" style="border-color: #ffffff;"></div>
      <div class="qr-crosshair top-right" style="border-color: #ffffff;"></div>
      <div class="qr-crosshair bottom-left" style="border-color: #ffffff;"></div>
      <div class="qr-crosshair bottom-right" style="border-color: #ffffff;"></div>
      <div style="border: 2px solid rgba(255,255,255,0.7); width: 85%; height: 75%; border-radius: 4px;"></div>
    </div>
    <p style="font-size: 12px; color: #94a3b8; margin-top: 14px;">Căn mã QR vào khung</p>
  </div>

  <!-- Recognized Result Card -->
  <div style="font-size: 12px; font-weight: 800; margin-bottom: 6px;">KẾT QUẢ NHẬN DIỆN</div>
  <div class="staff-card" style="padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <i class="fa-solid fa-qrcode" style="font-size: 26px;"></i>
      <div>
        <div style="font-size: 11px; color: var(--text-muted);">MÃ THIẾT BỊ</div>
        <strong style="font-size: 15px;">BK-EB-018</strong>
      </div>
    </div>
    <span style="font-size: 12px; font-weight: 700; color: var(--text-main);">ĐÃ NHẬN DIỆN</span>
  </div>

  <!-- Verification Success Banner matching 8.jpg -->
  <div class="dark-notice-banner" style="margin-bottom: 24px;">
    <div class="notice-icon" style="background: #ffffff; color: #0f172a;"><i class="fa-solid fa-check"></i></div>
    <div>
      <div style="font-weight: 800; font-size: 13.5px; margin-bottom: 2px;">Xác thực thành công</div>
      <div style="font-size: 11.5px; color: #94a3b8;">Đúng thiết bị tại Hub KTX Khu A · Ô số 018</div>
    </div>
  </div>

  <button class="btn-staff-primary" onclick="StaffApp.goToScreen('screen-maint-report')">
    <span>XÁC NHẬN THIẾT BỊ</span>
  </button>
  <button class="btn-staff-secondary" onclick="StaffApp.openMaintIncidentReport()">
    <span>BÁO CÁO SỰ CỐ</span>
  </button>
</section>
