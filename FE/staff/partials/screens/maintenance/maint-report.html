<!-- Partial: staff/partials/screens/maintenance/maint-report.html -->
<section id="screen-maint-report" class="staff-screen">
  <div class="screen-top-bar">
    <button class="nav-back-btn" onclick="StaffApp.goToScreen('screen-maint-scan')"><i class="fa-solid fa-angle-left"></i></button>
    <div class="top-bar-title-wrap">
      <div class="sub-label">CẬP NHẬT KẾT QUẢ</div>
      <div class="main-label">Báo cáo bảo trì</div>
    </div>
    <span style="font-size: 12px; font-weight: 700; color: var(--text-muted);" id="maintReportTaskCode">MT-102</span>
  </div>

  <!-- Black Checked Device Box -->
  <div class="dark-ticket-card" style="margin-bottom: 14px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
      <span style="font-size: 11px; color: #94a3b8; font-weight: 700;">THIẾT BỊ ĐÃ KIỂM TRA</span>
      <span style="font-size: 11px; color: #94a3b8;" id="maintReportHeaderId">Nhiệm vụ #102</span>
    </div>
    <div style="font-size: 15px; font-weight: 800;" id="maintReportDeviceLabel">BK-EB-018 · Hub KTX Khu A</div>
  </div>

  <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; margin-bottom: 6px;">
    <span>KẾT QUẢ XỬ LÝ</span>
    <span style="color: var(--accent-red); font-size: 11px;">Bắt buộc</span>
  </div>

  <!-- 2 Outcome Radios matching 9.jpg -->
  <div class="staff-card radio-card-select active" style="margin-bottom: 10px; padding: 12px;" onclick="StaffApp.selectMaintOutcome(this, 'onsite')">
    <label style="display: flex; align-items: center; gap: 12px; cursor: pointer;">
      <input type="radio" name="maintOutcome" checked>
      <div>
        <div style="font-size: 13.5px; font-weight: 800;">Đã sửa tại chỗ</div>
        <div style="font-size: 11.5px; color: var(--text-muted);">Sẵn sàng hoạt động</div>
      </div>
    </label>
  </div>

  <div class="staff-card radio-card-select" style="margin-bottom: 14px; padding: 12px;" onclick="StaffApp.selectMaintOutcome(this, 'workshop')">
    <label style="display: flex; align-items: center; gap: 12px; cursor: pointer;">
      <input type="radio" name="maintOutcome">
      <div>
        <div style="font-size: 13.5px; font-weight: 800;">Cần chuyển về xưởng</div>
        <div style="font-size: 11.5px; color: var(--text-muted);">Khóa tài nguyên</div>
      </div>
    </label>
  </div>

  <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; margin-bottom: 6px;">
    <span>GHI CHÚ KỸ THUẬT</span>
    <span style="color: var(--text-muted); font-size: 11px;">MT-05-IncidentReport</span>
  </div>
  <textarea class="form-textarea-sm" id="maintTechNotes" rows="3" placeholder="Nhập các bước đã thực hiện, linh kiện thay thế và lưu ý khi đưa thiết bị hoạt động trở lại..." style="margin-bottom: 14px;">Đã kiểm tra tiếp xúc giắc cắm BMS pin, reset mạch sạc và chạy thử động cơ thành công.</textarea>

  <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; margin-bottom: 6px;">
    <span>ẢNH XÁC NHẬN SAU SỬA</span>
    <span style="font-size: 11px; color: var(--text-muted);">Không bắt buộc</span>
  </div>
  <label class="dashed-upload-box" style="margin-bottom: 24px; cursor: pointer;">
    <i class="fa-solid fa-camera" style="font-size: 18px; margin-bottom: 6px;"></i>
    <span id="maintPhotoLabel" style="font-size: 12px; font-weight: 700;">ĐÍNH KÈM ẢNH PNG/JPEG</span>
    <input type="file" id="maintPhotoFile" accept="image/png,image/jpeg" style="display: none;" onchange="document.getElementById('maintPhotoLabel').innerText = this.files[0] ? this.files[0].name : 'ĐÍNH KÈM ẢNH PNG/JPEG'">
  </label>

  <button class="btn-staff-primary" onclick="StaffApp.submitMaintResult()">
    <span>GỬI KẾT QUẢ BẢO TRÌ</span>
  </button>
  <button class="btn-staff-secondary" onclick="StaffApp.openMaintIncidentReport()">
    <span>BÁO CÁO SỰ CỐ</span>
  </button>
</section>
