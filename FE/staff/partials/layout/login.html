<!-- Partial: staff/partials/layout/login.html -->
<div id="staffLoginView" style="display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.72); z-index: 9999; align-items: center; justify-content: center; padding: 16px;">
  <div style="background: #ffffff; width: 100%; max-width: 400px; border-radius: 16px; padding: 24px; box-shadow: 0 20px 50px rgba(15, 23, 42, 0.25);">
    <div style="text-align: center; margin-bottom: 18px;">
      <div style="width: 48px; height: 48px; border-radius: 50%; background: #0f172a; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 10px;">
        <i class="fa-solid fa-id-badge"></i>
      </div>
      <h2 style="font-size: 18px; font-weight: 800; margin: 0 0 4px 0;">ĐĂNG NHẬP NHÂN VIÊN</h2>
      <p style="font-size: 12.5px; color: #64748b; margin: 0;">Smart E-Mobility Hub · Staff & Bảo vệ</p>
    </div>

    <form id="staffLoginForm" onsubmit="StaffApp.submitLogin(event)">
      <div style="margin-bottom: 12px;">
        <label style="display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px;">Tài khoản / SĐT</label>
        <input type="text" id="staffLoginUsername" value="staff_b" required style="width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13.5px; box-sizing: border-box;">
      </div>
      <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px;">Mật khẩu</label>
        <input type="password" id="staffLoginPassword" value="staff123" required style="width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13.5px; box-sizing: border-box;">
      </div>
      <div id="staffLoginError" style="display: none; font-size: 12px; color: #dc2626; margin-bottom: 10px;"></div>
      <button type="submit" class="btn-staff-primary" style="width: 100%; padding: 11px; font-size: 14px;">ĐĂNG NHẬP</button>
    </form>
  </div>
</div>
