[pytest]
testpaths = tests
pythonpath = . BE
markers = 
    unit: API Backend/ Logic (White-Box)
    e2e: Interface, UX (Black-box Playwright)
    nfr: Non function Requirement
    manual_plan: For nfr can not implement in Mock Data
filterwarnings =
    ignore::DeprecationWarning
    ignore::pydantic.PydanticDeprecatedSince20